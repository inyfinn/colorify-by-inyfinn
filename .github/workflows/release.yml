# Oficjalny build release — format wymagany przez WordPress Plugin_Upgrader:
# colorify-by-inyfinn/colorify-by-inyfinn.php (jeden katalog główny, ścieżki POSIX).
# Źródło: https://developer.wordpress.org/plugins/wordpress-org/plugin-assets/#plugin-zip-files

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WordPress-compatible ZIP
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=colorify-by-inyfinn/ HEAD -o colorify-by-inyfinn.zip
          # Weryfikacja struktury (jak Plugin_Upgrader oczekuje jednego folderu slug).
          unzip -l colorify-by-inyfinn.zip | grep -q 'colorify-by-inyfinn/colorify-by-inyfinn.php'
          unzip -l colorify-by-inyfinn.zip | grep -q 'colorify-by-inyfinn/includes/colorify-scope.php'
          if unzip -l colorify-by-inyfinn.zip | grep -q '\\'; then
            echo 'ZIP contains backslashes in paths — invalid for WordPress.'
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: colorify-by-inyfinn.zip
          generate_release_notes: true
